<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- index.css asks for Inter everywhere but the font was never loaded, so
         most visitors were seeing a system fallback instead. One variable-font
         file covers the 300-900 range the stylesheets actually use. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300..900&display=swap"
      rel="stylesheet"
    />

    <!-- Default metadata (homepage). src/components/Seo.jsx replaces these per
         route once the app loads; they stay here for crawlers and link-preview
         bots that do not run JavaScript. There is deliberately no canonical
         tag here: a static one would point every route at the homepage. -->
    <title>Visa &amp; Immigration Consultants in Ahmedabad | Vectra Foreign Services</title>
    <meta name="description" content="Visa and immigration guidance from Ahmedabad for students, professionals and families: documentation, SOP support, language coaching and country advice." />

    <!-- Open Graph / Facebook / WhatsApp / LinkedIn -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Vectra Foreign Services" />
    <meta property="og:url" content="https://vectraforeignservices.com/" />
    <meta property="og:title" content="Visa &amp; Immigration Consultants in Ahmedabad | Vectra Foreign Services" />
    <meta property="og:description" content="Visa and immigration guidance from Ahmedabad for students, professionals and families: documentation, SOP support, language coaching and country advice." />
    <meta property="og:image" content="https://vectraforeignservices.com/logo.webp" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://vectraforeignservices.com/" />
    <meta name="twitter:title" content="Visa &amp; Immigration Consultants in Ahmedabad | Vectra Foreign Services" />
    <meta name="twitter:description" content="Visa and immigration guidance from Ahmedabad for students, professionals and families: documentation, SOP support, language coaching and country advice." />
    <meta name="twitter:image" content="https://vectraforeignservices.com/logo.webp" />

    <!-- Structured data. Every value below comes from information already
         published on the site (footer, contact page, terms of service, about
         page). Nothing here is invented: no ratings, reviews, registration
         numbers or awards. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebSite",
            "@id": "https://vectraforeignservices.com/#website",
            "url": "https://vectraforeignservices.com/",
            "name": "Vectra Foreign Services",
            "inLanguage": "en",
            "publisher": { "@id": "https://vectraforeignservices.com/#organization" }
          },
          {
            "@type": ["Organization", "ProfessionalService"],
            "@id": "https://vectraforeignservices.com/#organization",
            "name": "Vectra Foreign Services",
            "legalName": "Vectra Foreign Services Private Limited",
            "url": "https://vectraforeignservices.com/",
            "logo": "https://vectraforeignservices.com/VFS-removebg-preview.png",
            "image": "https://vectraforeignservices.com/VFS-removebg-preview.png",
            "description": "Vectra Foreign Services supports students, professionals, and families in achieving their international goals with expert visa guidance and immigration consulting.",
            "email": "info@vectraforeignservices.com",
            "telephone": "+918401172400",
            "address": {
              "@type": "PostalAddress",
              "streetAddress": "2nd Floor - 202, No.32, T.P. Scheme, Olive Greens, above Shambhu's Coffee, Gota",
              "addressLocality": "Ahmedabad",
              "addressRegion": "Gujarat",
              "postalCode": "382481",
              "addressCountry": "IN"
            },
            "openingHoursSpecification": [
              {
                "@type": "OpeningHoursSpecification",
                "dayOfWeek": ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"],
                "opens": "10:00",
                "closes": "18:00"
              }
            ],
            "contactPoint": {
              "@type": "ContactPoint",
              "contactType": "customer support",
              "telephone": "+918401172400",
              "email": "info@vectraforeignservices.com"
            },
            "parentOrganization": {
              "@type": "Organization",
              "name": "Vectra Group",
              "url": "https://vectragroup.in/"
            },
            "sameAs": [
              "https://www.facebook.com/share/1aqXaxdXT6/",
              "https://www.instagram.com/vectra_foreignservices_vfs",
              "https://www.linkedin.com/company/vectra-foreign-services/",
              "https://x.com/vectraoverseas"
            ]
          }
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
